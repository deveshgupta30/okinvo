name: okinvo

x-app-env: &app-env
  env_file: .env # `${…}` interpolation below also reads ./.env

services:
  caddy: # no depends_on: a broken app yields a 502, not a missing proxy
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { APP_DOMAIN: "${APP_DOMAIN:?set APP_DOMAIN in .env}" }
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  app:
    image: docker.io/deveshgupta30/okinvo:${OKINVO_VERSION:-latest}
    build: { context: ., dockerfile: docker/Dockerfile, target: runner }
    restart: unless-stopped
    <<: *app-env
    environment: # container-specific values derived here so .env holds them once
      NODE_ENV: production
      TRUST_PROXY: "true"
      STORAGE_LOCAL_ROOT: /data/storage
      BACKUP_STATUS_FILE: /backups/last-backup.json # written by the backup service, read-only here
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - app_data:/data
      - backups:/backups:ro
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [web, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  migrate: # only needs the database URL — no env_file, so it never sees app secrets
    image: docker.io/deveshgupta30/okinvo:${OKINVO_VERSION:-latest}-migrate
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHECKPOINT_DISABLE: "1" # Prisma CLI telemetry would try to write a cache on the read-only FS
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data]
    depends_on: { postgres: { condition: service_healthy } }

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg_data:/var/lib/postgresql] # postgres:18 image: mount the parent, not …/data
    security_opt: [no-new-privileges:true]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup: # nightly pg_dump + storage tarball into the backups volume (docker/backup/backup.sh)
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment: # only what the scripts need — never the app's secrets (no env_file here)
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["/bin/sh", "/backup/backup.sh", "--daemon"]
    volumes:
      - ./docker/backup:/backup:ro
      - app_data:/data # read during backup; restore.sh writes here
      - backups:/backups
    security_opt: [no-new-privileges:true]
    networks: [data]
    depends_on: { postgres: { condition: service_healthy } }

  seaweedfs: # only with: docker compose --profile s3 up
    profiles: [s3]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >
      server -dir=/data -ip=seaweedfs -master.volumeSizeLimitMB=1024
             -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  web: {}
  data: { internal: true }

volumes:
  pg_data: {}
  app_data: {}
  backups: {}
  caddy_data: {}
  caddy_config: {}
  seaweed_data: {}
