<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>okinvo concept B — circulation "o"</title>
  <!-- o as a billing cycle: ink arc (issued / outstanding) -->
  <path fill="none" stroke="#17191E" stroke-width="30" stroke-linecap="round"
        d="M166,62.2 A76,76 0 1 1 56.6,154.0"/>
  <!-- pastel-green arc (settled / returning to close the loop) -->
  <path fill="none" stroke="#87D9A8" stroke-width="30" stroke-linecap="butt"
        d="M56.6,154.0 A76,76 0 0 1 102.0,56.6"/>
  <!-- crisp arrowhead at the returning end, pointing clockwise into the gap -->
  <path fill="#87D9A8"
        d="M130.2,46.3 L110.2,79.2 L93.8,34.0 Z"/>
</svg>
