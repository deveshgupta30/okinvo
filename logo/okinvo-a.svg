<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>okinvo concept A — "ok" monogram</title>
  <!-- o : ink ring (x-height letter) -->
  <path fill-rule="evenodd" fill="#17191E"
        d="M78,104 A48,48 0 1 1 78,200 A48,48 0 1 1 78,104 Z
           M78,130 A22,22 0 1 1 78,174 A22,22 0 1 1 78,130 Z"/>
  <!-- k : stem (ascender) -->
  <rect x="154" y="56" width="28" height="144" fill="#17191E"/>
  <!-- k : lower leg -->
  <path fill="none" stroke="#17191E" stroke-width="28" stroke-linecap="round"
        d="M178,150 L214,200"/>
  <!-- k : upper arm = pastel-green approval gesture -->
  <path fill="none" stroke="#87D9A8" stroke-width="28" stroke-linecap="round"
        d="M178,150 L226,86"/>
</svg>
