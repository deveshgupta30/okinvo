body:
  - type: markdown
    attributes:
      value: |
        ## ☕ Pull up a chair

        This is the chai stall of okinvo. Talk about invoicing, self-hosting, that one client who pays in 90 days "as per policy", or how you finally killed your spreadsheet. If it's a bug, the [issue tracker](https://github.com/deveshgupta30/okinvo/issues/new/choose) is a better home for it.

        House rules, short version: be kind, keep real client data out, and no recruiter spam. 🙂

  - type: textarea
    id: say
    attributes:
      label: What's on your mind?
      placeholder: Is it just me, or does every GST portal outage happen on the 20th?
    validations:
      required: true
