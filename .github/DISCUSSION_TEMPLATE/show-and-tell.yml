body:
  - type: markdown
    attributes:
      value: |
        ## 🎉 Show off

        Running okinvo on a Raspberry Pi in a cupboard? Built a lovely invoice template? Wired it to your agent through MCP? Sent your first invoice and actually got paid? I want to see it.

        Screenshots welcome. Blur anything real: names, GSTINs, amounts your accountant wouldn't want online.

  - type: textarea
    id: what
    attributes:
      label: What did you make or set up?
      placeholder: okinvo on a ₹2,000 refurbished mini PC, Caddy on my own domain, nightly backups to a USB drive I keep in a biscuit tin.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How did you do it?
      description: The useful bits for anyone who wants to copy you. Config snippets are gold (minus the secrets).

  - type: textarea
    id: lessons
    attributes:
      label: Anything that tripped you up?
      description: Every rough edge you mention is a doc fix waiting to happen.
