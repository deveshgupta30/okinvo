name: security
# Trivy over the repository (vulnerabilities in the lockfile, secrets, misconfigurations) and
# over the Compose files, Kustomize manifests and the Dockerfile, on every PR, on main, and
# weekly. Runs through Trivy's container on both runner kinds (self-hosted Windows and
# GitHub-hosted Ubuntu) so the steps are identical; see pick-runner.yml for the runner choice.
# Vendored trees (node_modules, .next, public/fonts) are skipped: the lockfile carries the
# dependency facts and the fonts are binary.
on:
  push: { branches: [main] }
  pull_request: {}
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TRIVY_IMAGE: aquasec/trivy:0.70.0
  SKIP_DIRS: node_modules,.next,public/fonts,test-results,playwright-report
  MSYS_NO_PATHCONV: "1"

jobs:
  runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  trivy:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: repository — vulnerabilities, secrets, misconfigurations
        run: |
          set -euo pipefail
          repo="${GITHUB_WORKSPACE//\\//}"
          status=0
          docker run --rm -v "$repo:/repo" -w /repo "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed --skip-version-check --timeout 15m --ignorefile .trivyignore.yaml --skip-dirs "$SKIP_DIRS" \
            --format table --output /repo/trivy-fs.txt . || status=$?
          cat trivy-fs.txt
          { echo '### Trivy — repository'; echo '```'; cat trivy-fs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: configuration — Compose, Kustomize and the Dockerfile
        run: |
          set -euo pipefail
          repo="${GITHUB_WORKSPACE//\\//}"
          status=0
          docker run --rm -v "$repo:/repo" -w /repo "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 --skip-version-check --timeout 15m --ignorefile .trivyignore.yaml \
            --skip-dirs "$SKIP_DIRS,public" --format table --output /repo/trivy-config.txt . || status=$?
          cat trivy-config.txt
          { echo '### Trivy — configuration'; echo '```'; cat trivy-config.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: always()
        run: rm -f trivy-fs.txt trivy-config.txt
