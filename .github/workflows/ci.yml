name: ci
on:
  push: { branches: [main] }
  pull_request: {}

env:
  PNPM_VERSION: 10.34.5
  NODE_VERSION: 24.21.0
  DATABASE_URL: postgresql://okinvo:okinvo@127.0.0.1:5432/okinvo
  APP_URL: http://127.0.0.1:3000
  AUTH_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
  FIELD_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  # `pnpm start` runs with NODE_ENV=production, whose validation requires an allow-list and a provider.
  AUTH_ALLOWED_EMAILS: ci@example.com
  AUTH_GITHUB_ID: ci-placeholder
  AUTH_GITHUB_SECRET: ci-placeholder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f compose.dev.yml up -d --wait postgres
      - run: pnpm db:generate
      - run: pnpm lint && pnpm typecheck && pnpm format:check
      - run: pnpm design:lint && pnpm design:tokens --check
      - run: pnpm db:migrate
      - run: pnpm test -- --coverage
      - run: pnpm audit --audit-level=high
      - run: pnpm build

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f compose.dev.yml up -d --wait postgres
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: false
          load: true
          tags: okinvo:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: okinvo:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
