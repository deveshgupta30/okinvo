# Findings Trivy (security.yml) may skip, each with the reason. Keep in step with the pnpm
# `auditConfig.ignoreGhsas` list in package.json; remove an entry as soon as the fix lands.
vulnerabilities:
  - id: GHSA-vfj7-8cjw-p6xm
    statement: >-
      braces 3.0.3 reaches the tree only through eslint-config-next (fast-glob, micromatch) at
      lint time; it never runs in the image or against user input, and no patched release exists
      yet. Ignored in pnpm audit as well; drop both entries when braces ships a fix.
misconfigurations:
  - id: KSV-0109
    paths:
      - k8s/base/configmap.yaml
    statement: >-
      AUTH_PASSWORD_SIGNIN is a boolean feature flag ("true"/"false"), not a credential; the
      name matched the secret-keyword heuristic. Real secrets live in the okinvo-secrets Secret.
