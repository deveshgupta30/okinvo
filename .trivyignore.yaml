# Findings Trivy (security.yml) may skip, each with the reason. Keep in step with the pnpm
# `auditConfig.ignoreGhsas` list in package.json; remove an entry as soon as the fix lands.
vulnerabilities:
  - id: GHSA-mrhx-c7xc-m3w5
    statement: >-
      zod 3.25.76 is pulled in only by @google/design.md (pnpm design:lint), a dev-only linter that
      reads the repository's own DESIGN.md; it never ships in an image or sees user input, and no
      patched 3.x exists. The app's own zod is 4.6.7 (fixed). Ignored in pnpm audit as well; drop
      both entries when design.md moves to zod 4.
  - id: GHSA-g3hv-75wg-m249
    statement: >-
      minimatch amplification needs an attacker-chosen glob pattern; okinvo never passes user
      input to minimatch (eslint at lint time, archiver walking its own paths for exceljs). The
      fix exists only in 11.x, which eslint 9 and archiver 5 cannot take. Ignored in pnpm audit as
      well; drop both entries when those dependants move to minimatch 11.
misconfigurations:
  - id: KSV-0109
    paths:
      - k8s/base/configmap.yaml
    statement: >-
      AUTH_PASSWORD_SIGNIN is a boolean feature flag ("true"/"false"), not a credential; the
      name matched the secret-keyword heuristic. Real secrets live in the okinvo-secrets Secret.
