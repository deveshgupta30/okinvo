name: okinvo-dev

services:
  postgres:
    image: postgres:18.6-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: okinvo
      POSTGRES_PASSWORD: okinvo
      POSTGRES_DB: okinvo
    volumes: [pg_dev_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okinvo -d okinvo"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit: # SMTP sink for development and the email integration tests (UI on http://127.0.0.1:8025)
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    ports: ["127.0.0.1:2525:1025", "127.0.0.1:8025:8025"] # 1025 is inside Windows' reserved port range
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  pg_dev_data: {}
