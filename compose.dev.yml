name: okinvo-dev

services:
  postgres:
    image: postgres:18.6-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: okinvo
      POSTGRES_PASSWORD: okinvo
      POSTGRES_DB: okinvo
    volumes: [pg_dev_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okinvo -d okinvo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_dev_data: {}
