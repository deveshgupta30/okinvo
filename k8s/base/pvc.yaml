apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  labels:
    app.kubernetes.io/name: okinvo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  labels:
    app.kubernetes.io/name: okinvo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
