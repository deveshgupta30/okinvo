apiVersion: apps/v1
kind: Deployment
metadata:
  name: okinvo
  labels:
    app.kubernetes.io/name: okinvo
    app.kubernetes.io/component: app
spec:
  replicas: 1
  # The local storage driver needs an RWO volume: one pod at a time. The with-seaweedfs overlay
  # switches to RollingUpdate and two replicas.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: okinvo
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okinvo
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Same semantics as the compose `migrate` service; `prisma migrate deploy` takes an advisory
        # lock, so it is safe even when several replicas start at once.
        - name: migrate
          image: docker.io/deveshgupta30/okinvo-migrate
          envFrom:
            - secretRef:
                name: okinvo-secrets
          env:
            - name: CHECKPOINT_DISABLE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      containers:
        - name: app
          image: docker.io/deveshgupta30/okinvo
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: okinvo-config
            - secretRef:
                name: okinvo-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-data
              mountPath: /data
            - name: backups
              mountPath: /backups
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi } # no CPU limit: avoids throttling PDF renders
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data
        - name: backups
          persistentVolumeClaim:
            claimName: backups
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
