# NOT applied by the kustomization and NOT a template to fill in and commit. Create the real Secret
# out of band from a gitignored env file (scripts/gen-secrets.sh produces the three generated
# values):
#
#   kubectl -n okinvo create secret generic okinvo-secrets --from-env-file=.env.secrets
#
# .env.secrets holds, one KEY=value per line:
#   AUTH_SECRET                - 48 random bytes, base64
#   FIELD_ENCRYPTION_KEY       - 32 random bytes, base64
#   POSTGRES_PASSWORD          - the database password
#   DATABASE_URL               - postgresql://okinvo:<POSTGRES_PASSWORD>@postgres:5432/okinvo
#   AUTH_GITHUB_ID / AUTH_GITHUB_SECRET, AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET,
#   AUTH_KEYCLOAK_* / AUTH_CASDOOR_* / AUTH_OIDC_*   - whichever providers you use
#   SMTP_HOST, SMTP_PORT, SMTP_SECURITY, SMTP_USER, SMTP_PASSWORD, SMTP_FROM - optional
#   S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY - with the with-seaweedfs overlay
#
# This file exists only so the expected keys are documented next to the manifests that consume
# them (envFrom secretRef: okinvo-secrets in app-deployment.yaml, backup-cronjob.yaml and
# postgres-statefulset.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: okinvo-secrets
type: Opaque
stringData:
  AUTH_SECRET: replace-me
  FIELD_ENCRYPTION_KEY: replace-me
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql://okinvo:replace-me@postgres:5432/okinvo
