apiVersion: v1
kind: Service
metadata:
  name: wiki
  labels:
    app.kubernetes.io/name: okinvo
    app.kubernetes.io/component: wiki
spec:
  selector:
    app.kubernetes.io/name: okinvo
    app.kubernetes.io/component: wiki
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki
  labels:
    app.kubernetes.io/name: okinvo
    app.kubernetes.io/component: wiki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: okinvo
      app.kubernetes.io/component: wiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okinvo
        app.kubernetes.io/component: wiki
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the node user of the Wiki.js image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wiki
          image: ghcr.io/requarks/wiki:2.5
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: wiki
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: okinvo-config, key: POSTGRES_USER } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: okinvo-secrets, key: POSTGRES_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /wiki/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            initialDelaySeconds: 60
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: okinvo-docs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt # remove if certificates come from elsewhere
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["docs.invoices.example.com"]
      secretName: okinvo-docs-tls
  rules:
    - host: docs.invoices.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiki
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: okinvo
      app.kubernetes.io/component: wiki
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: okinvo
              app.kubernetes.io/component: postgres
      ports:
        - port: 5432
    - to: # DNS
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
