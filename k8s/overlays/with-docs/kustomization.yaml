apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# compose-parity plus the Wiki.js documentation site (compose profile `docs`): a `wiki` Deployment
# and Service, an Ingress on docs.<host>, NetworkPolicies, and the init script that creates the
# `wiki` database on the first Postgres initialisation (see k8s/README.md for existing installs).
# Patch the two hosts, APP_URL and the allow-list for your install:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/with-docs | kubectl apply -f -
resources:
  - ../../base
  - wiki.yaml

configMapGenerator:
  - name: postgres-initdb
    files:
      - 10-wiki.sh=../../../docker/postgres/initdb/10-wiki.sh

patches:
  - target:
      kind: ConfigMap
      name: okinvo-config
    patch: |
      - op: replace
        path: /data/APP_URL
        value: https://invoices.example.com
      - op: replace
        path: /data/AUTH_ALLOWED_EMAILS
        value: owner@example.com
  - target:
      kind: Ingress
      name: okinvo
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: invoices.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: invoices.example.com
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: initdb, configMap: { name: postgres-initdb } }
  - target:
      kind: NetworkPolicy
      name: postgres
    patch: |
      - op: add
        path: /spec/ingress/0/from/-
        value:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: okinvo
              app.kubernetes.io/component: wiki
