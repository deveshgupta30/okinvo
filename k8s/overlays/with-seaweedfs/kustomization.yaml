apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# EXPERIMENTAL (see k8s/README.md): blob storage on SeaweedFS (S3 API) instead of an RWO volume,
# so the app can run two replicas with a rolling update; rate limits move to Postgres to be shared
# across them. The app pod drops the app-data and backups volumes (RWO volumes cannot follow two
# pods), so Settings → Data cannot show the backup status here, and backup.sh covers the database
# only - snapshot the seaweed-data volume with your cluster's tooling.
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/with-seaweedfs | kubectl apply -f -
#
# Add to .env.secrets before the first apply: S3_ENDPOINT=http://seaweedfs:8333, S3_BUCKET=okinvo,
# S3_ACCESS_KEY / S3_SECRET_KEY (the same values as docker/seaweedfs/s3.json).
resources:
  - ../../base
  - seaweedfs.yaml

patches:
  - target:
      kind: ConfigMap
      name: okinvo-config
    patch: |
      - op: replace
        path: /data/STORAGE_DRIVER
        value: s3
      - op: replace
        path: /data/RATE_LIMIT_STORE
        value: postgres
      - op: add
        path: /data/S3_REGION
        value: us-east-1
      - op: remove
        path: /data/BACKUP_STATUS_FILE
  - target:
      kind: Deployment
      name: okinvo
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
      # Blobs live in S3: no ReadWriteOnce volumes on a multi-replica Deployment.
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - { name: tmp, mountPath: /tmp }
          - { name: next-cache, mountPath: /app/.next/cache }
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - { name: tmp, emptyDir: {} }
          - { name: next-cache, emptyDir: {} }
  - target:
      kind: NetworkPolicy
      name: app
    patch: |
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: okinvo
                  app.kubernetes.io/component: seaweedfs
          ports:
            - port: 8333
